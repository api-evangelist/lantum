name: Lantum
kind: company
description: >-
  Lantum (formerly Network Locum, founded 2012 in Shoreditch, London) is a
  United Kingdom healthcare workforce-management company whose Connected Scheduling
  platform helps NHS primary- and secondary-care organisations build digital staff
  banks, manage rotas and e-rostering, run automated timesheets and payments, and
  fill clinical shifts from a verified network of 30,000+ locum clinicians. It serves
  over 2,000 primary-care organisations, GP practices, PCNs, GP federations, and
  integrated care systems across the UK. Lantum is a practice-management and workforce
  platform rather than a clinical-data interoperability vendor, and it does NOT publish
  a public developer portal, a documented REST API, or an HL7 FHIR CapabilityStatement.
  Its product is delivered through a gated web and mobile application (lantum.com),
  onboarded via sales and demo request, with any system integrations (for example to
  GP clinical systems) handled through private partner arrangements rather than a
  self-serve public API.
